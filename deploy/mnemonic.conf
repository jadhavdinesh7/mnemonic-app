<VirtualHost *:80>
    # Change ServerName to your domain if you have one, otherwise leave as-is
    # ServerName mnemonic.local

    DocumentRoot /var/www/mnemonic

    <Directory /var/www/mnemonic>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback — all routes serve index.html
        # (hash routing doesn't need this, but good to have)
        FallbackResource /index.html
    </Directory>

    # Cache static assets (JS, CSS, images) for 1 year
    <LocationMatch "\.(js|css|svg|png|jpg|webp|woff2)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Don't cache HTML (so deploys are picked up immediately)
    <LocationMatch "\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>

    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/mnemonic-error.log
    CustomLog ${APACHE_LOG_DIR}/mnemonic-access.log combined
</VirtualHost>
